version: 2
updates:
  # GitHub Actions: grouped into one weekly PR.
  #
  # Note this group deliberately has NO `update-types` filter, unlike the npm
  # block below. Every action here is pinned by major tag (actions/checkout@v4,
  # softprops/action-gh-release@v2, ...), so the only update Dependabot can ever
  # propose is a major (@v4 -> @v5). Filtering to minor/patch would exclude every
  # real update and the group would never produce a PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm dependencies (published dual ESM/CJS library).
  #   * minor + patch → grouped into ONE weekly PR.
  #   * major bumps are deliberately NOT grouped — Dependabot raises one PR per
  #     major so each can be triaged on its own (breaking changes / migrations).
  #     A grouped batch must never be blocked by one incompatible major.
  #
  # Every dependency here is a devDependency (the package has zero runtime
  # dependencies), so `prefix-development` is what actually fires; `prefix` is
  # kept only for the case where a runtime dependency is added later.
  #
  # No `labels` key: Dependabot's defaults ("dependencies" + the "javascript"
  # ecosystem label) are created automatically, whereas labels listed explicitly
  # here are silently ignored if they don't already exist in the repo.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Keep package.json ranges stable: only rewrite a range when the new version
    # doesn't already satisfy it. The default strategy for a published library is
    # `widen`, which would rewrite `^25.0.0` into `>=25.0.0 <27.0.0` — a range
    # style this repo doesn't use, and pointless here because there are no
    # runtime dependencies for a consumer to resolve against.
    versioning-strategy: "increase-if-necessary"
    # The React devDependencies are what CI actually exercises. Which React line
    # the test suite runs against is a deliberate support-matrix decision — it
    # interacts with the `peerDependencies: react >=16.8.0` claim in package.json
    # and with @testing-library/react's own peer range — so it should be changed
    # on purpose, not carried in on a weekly bump. Minor/patch still flow.
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
