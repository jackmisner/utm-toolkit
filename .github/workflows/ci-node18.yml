name: CI - Node 18

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run type-check

      # No lint step here. oxlint's native bindings require Node
      # ^20.19.0 || >=22.12.0, so npm skips installing them on Node 18 and
      # oxlint fails with "Cannot find module './oxlint.linux-x64-gnu.node'".
      # Linting is static analysis of source — the node20 and node22 jobs
      # already cover it, and repeating it per Node version proves nothing.
      # This job's purpose is to prove the library itself runs on Node 18,
      # which type-check, test and build below still do.

      - name: Run tests
        env:
          CI: true
          NODE_ENV: test
        run: npm test

      - name: Build package
        run: npm run build
