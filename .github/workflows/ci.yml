name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    uses: ./.github/workflows/format.yml
    secrets: inherit

  test-node22:
    needs: format
    uses: ./.github/workflows/ci-node22.yml
    secrets: inherit

  test-node24:
    needs: format
    uses: ./.github/workflows/ci-node24.yml

  test-node26:
    needs: format
    uses: ./.github/workflows/ci-node26.yml
